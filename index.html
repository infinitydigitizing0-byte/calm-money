<style>
:root{
  --bg:#F4F1FA; --card:#FFFFFF; --ink:#2E2A3D; --muted:#7A7590; --line:#E7E2F0; --soft:#F8F6FC;
  --safe:#3E9C7A; --safe-l:#DDF2EA; --bill:#E27A6F; --bill-l:#FBE4E1; --in:#4A84D6; --in-l:#E1ECFA;
  --goal:#8C6BD6; --goal-l:#ECE5FA; --debt:#D99A2B; --debt-l:#FAEFD9; --env:#2FA3B3; --env-l:#DDF3F6;
  --brand:#6B5BD2; --brand-l:#E9E6FB; --shadow:0 6px 22px rgba(60,40,110,.08); --r:20px;
  --font: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
[data-theme="dark"]{
  --bg:#13132A; --card:#1D1D3A; --ink:#ECEAF7; --muted:#A3A0C2; --line:#2E2D52; --soft:#24244A;
  --safe:#5FD3A8; --safe-l:#1E3B3A; --bill:#FF9488; --bill-l:#3D2433; --in:#7FB0FF; --in-l:#1F2E4D;
  --goal:#B49BFF; --goal-l:#2D2652; --debt:#F6C15C; --debt-l:#3A3122; --env:#5FD0DE; --env-l:#1B3742;
  --brand:#9C8CFF; --brand-l:#2B2858; --shadow:0 6px 22px rgba(0,0,0,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-text-size-adjust:100%}
body{min-height:100vh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--brand)}
.wrap{max-width:1100px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.hello{font-size:26px;font-weight:800;letter-spacing:-.3px}
.date{color:var(--muted);font-size:14px;margin-top:2px}
.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;font-size:19px}
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
.grid>*{min-width:0}
@media(min-width:900px){
  body{padding-bottom:0;padding-left:236px}
  .grid.two{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
  .grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
  .bottomnav{display:none!important}

}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card h2{font-size:17px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px;justify-content:space-between}
.card h2 .l{display:flex;align-items:center;gap:8px}
.sub{color:var(--muted);font-size:13.5px;line-height:1.45}

.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:700;background:var(--soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}

.chip.on{border-color:var(--brand);background:var(--brand-l);color:var(--brand)}
.btn{padding:12px 18px;border-radius:14px;background:var(--brand);color:#fff;font-weight:800;font-size:15px}
.btn.ghost{background:var(--soft);color:var(--ink)} .btn.red{background:var(--bill)} .btn.green{background:var(--safe)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.btn:active,.chip:active,.iconbtn:active{transform:scale(.97)}
.row{display:flex;gap:10px;align-items:center}

input,select,textarea{width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--soft);outline:none;font-size:16px}
input:focus,select:focus,textarea:focus{border-color:var(--brand)}
textarea{min-height:110px;resize:vertical;line-height:1.5}
label.f{display:block;font-size:12.5px;font-weight:800;color:var(--muted);margin:10px 0 5px;letter-spacing:.3px}
.amount{font-size:30px;font-weight:900;padding:12px 16px}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.dot{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-size:18px;flex:none}
.item .t{font-weight:800;font-size:15px} .item .s{color:var(--muted);font-size:12.5px;margin-top:2px}

.amt.out{color:var(--bill)} .amt.in{color:var(--in)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile .v{overflow-wrap:anywhere}
@media(max-width:420px){.tile{padding:10px}.tile .v{font-size:16px}.tile .k{font-size:10px;letter-spacing:.4px}}
.tile{background:var(--soft);border-radius:16px;padding:12px}
.tile .k{font-size:11.5px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.tile .v{font-size:20px;font-weight:900;margin-top:3px}
.bar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--brand)}

.t-paid{background:var(--safe-l);color:var(--safe)} .t-due{background:var(--debt-l);color:var(--debt)} .t-late{background:var(--bill-l);color:var(--bill)} .t-in{background:var(--in-l);color:var(--in)}
.empty{color:var(--muted);font-size:14px;padding:14px 4px;text-align:center}
.check{display:flex;align-items:center;gap:12px;padding:8px 0}
.check input[type=checkbox]{width:24px;height:24px;flex:none;accent-color:var(--safe)}
.check input[type=text]{padding:9px 12px}
.check.done input[type=text]{text-decoration:line-through;color:var(--muted)}
/* nav */
.bottomnav{position:fixed;left:0;right:0;bottom:0;background:var(--card);box-shadow:0 -4px 20px rgba(60,40,110,.08);display:flex;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:20}
.bottomnav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:800;color:var(--muted);padding:4px 8px;border-radius:12px;min-width:58px}
.bottomnav button b{font-size:21px;line-height:1}
.bottomnav button.on{color:var(--brand);background:var(--brand-l)}
.sidenav{display:none;position:fixed;left:0;top:0;bottom:0;width:220px;background:var(--card);flex-direction:column;padding:22px 14px;gap:4px;box-shadow:var(--shadow);overflow:auto;z-index:20}
.sidenav .brand{font-weight:900;font-size:20px;padding:0 10px 16px;display:flex;align-items:center;gap:8px}
.sidenav button{text-align:left;padding:11px 12px;border-radius:13px;font-weight:800;font-size:14.5px;color:var(--muted);display:flex;gap:10px;align-items:center}
.sidenav button.on{background:var(--brand-l);color:var(--brand)}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .h{font-size:11.5px;font-weight:800;color:var(--muted);text-align:center;padding:4px 0}
.cal .d{background:var(--soft);border-radius:13px;min-height:74px;padding:6px;font-size:12px;cursor:pointer;border:2px solid transparent;overflow:hidden}
.cal .d.o{opacity:.35}
.cal .d.today{border-color:var(--brand)}
.cal .d.sel{background:var(--brand-l)}
.cal .n{font-weight:900;font-size:13px}
.cal .m{display:block;font-size:10.5px;font-weight:800;border-radius:6px;padding:1px 4px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m.b{background:var(--bill-l);color:var(--bill)} .m.p{background:var(--in-l);color:var(--in)} .m.s{color:var(--muted);font-weight:700}
@media(max-width:520px){.cal .d{min-height:58px;padding:4px}.cal .m{font-size:9px;padding:0 2px}.big{font-size:46px}}
/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(20,15,40,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50;padding:0}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:24px}}
.sheet h3{font-size:20px;font-weight:900;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--card);padding:12px 18px;border-radius:14px;font-weight:800;z-index:60;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.focus .nofocus{display:none!important}
.hide{display:none!important}
.kbd{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--soft);border-radius:6px;padding:1px 6px;font-size:12px}
.help h4{font-size:15px;margin:14px 0 4px}.help p,.help li{font-size:14px;line-height:1.55;color:var(--ink)}.help ul{padding-left:18px}
.badge{display:flex;gap:12px;align-items:center;padding:12px;border-radius:16px;background:var(--soft)}
.badge .e{font-size:28px;width:48px;height:48px;border-radius:15px;display:grid;place-items:center;background:var(--card)}
.badge.lock{opacity:.5;filter:grayscale(1)}
.seg{display:inline-flex;background:var(--soft);border-radius:13px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:8px 12px;border-radius:10px;font-weight:800;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}
svg text{fill:var(--muted);font-family:var(--font)}
@media print{.bottomnav,.sidenav,.noprint{display:none!important}body{padding:0}.card{box-shadow:none;border:1px solid #ddd}}
</style>

<body>
<nav class="sidenav" id="sidenav"></nav>
<main class="wrap" id="app"></main>
<nav class="bottomnav" id="bottomnav"></nav>
<div id="layer"></div>
<noscript><div style="padding:30px;font-family:sans-serif">Please turn on JavaScript, or open this planner in Safari, Chrome or Edge.</div></noscript>
<script>
"use strict";
/* ================================================================ storage & helpers */
const KEY = "calmmoney.v1";
let S = null, view = "today", sel = {}, focusMode = false;
const DEFAULT_CATS = [
  {n:"Groceries",e:"🛒"},{n:"Eating out",e:"🍔"},{n:"Coffee",e:"☕"},{n:"Transport",e:"🚌"},{n:"Fuel",e:"⛽"},{n:"Shopping",e:"🛍️"},
  {n:"Fun",e:"🎉"},{n:"Health",e:"💊"},{n:"Home",e:"🏠"},{n:"Kids",e:"🧸"},{n:"Pets",e:"🐾"},{n:"Gifts",e:"🎁"},{n:"Subscriptions",e:"📺"},{n:"Other",e:"✨"}];
function blank(){
  return {v:1, created:today(), profile:{name:"", cur:"$", dec:2}, look:{theme:"auto", mode:"simple", label:"Safe to spend"},
    accounts:[{id:uid(),name:"Checking",type:"spending",start:0}], pays:[], bills:[], tx:[], goals:[], debts:[],
    envelopes:{}, cats:DEFAULT_CATS.slice(), todos:{}, brain:"", notes:{}, ms:{}, onboarded:false};
}
function load(){ try{ const t = localStorage.getItem(KEY); return t ? JSON.parse(t) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast("Could not save — storage is full or blocked."); } checkMilestones(); }
function uid(){ return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3); }
function pad(n){ return String(n).padStart(2, "0"); }
function ds(d){ return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
function today(){ return ds(new Date()); }
function dd(s){ const [y,m,d] = s.split("-").map(Number); return new Date(y, m - 1, d); }
function addD(s, n){ const d = dd(s); d.setDate(d.getDate() + n); return ds(d); }
function diffD(a, b){ return Math.round((dd(b) - dd(a)) / 864e5); }
function monthKey(s){ return s.slice(0, 7); }
function mStart(s){ return s.slice(0, 8) + "01"; }
function mEnd(s){ const d = dd(mStart(s)); d.setMonth(d.getMonth() + 1); d.setDate(0); return ds(d); }
function addM(s, n){ const d = dd(mStart(s)); d.setMonth(d.getMonth() + n); return ds(d); }
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
function nice(s, withDow){ const d = dd(s); return (withDow ? DOW[d.getDay()] + " " : "") + d.getDate() + " " + MON[d.getMonth()]; }
function money(n, sign){ n = Number(n) || 0; const neg = n < 0; const v = Math.abs(n).toLocaleString(undefined, {minimumFractionDigits:S.profile.dec, maximumFractionDigits:S.profile.dec});
  return (neg ? "−" : (sign && n > 0 ? "+" : "")) + S.profile.cur + v; }
function num(v){ const n = parseFloat(String(v).replace(/[^0-9.\-]/g, "")); return isNaN(n) ? 0 : Math.round(n * 100) / 100; }
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function catE(n){ const c = S.cats.find(c => c.n === n); return c ? c.e : (n === "Bills" ? "🧾" : n === "Savings" ? "🐷" : n === "Debt" ? "💳" : n === "Income" ? "💰" : "✨"); }
function toast(t){ const el = document.createElement("div"); el.className = "toast"; el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2600); }
function acc(id){ return S.accounts.find(a => a.id === id) || S.accounts[0]; }

/* ================================================================ schedules */
const FREQS = {once:"One time", weekly:"Every week", fortnightly:"Every 2 weeks", fourweekly:"Every 4 weeks", twicemonthly:"Twice a month", monthly:"Every month", quarterly:"Every 3 months", yearly:"Every year", irregular:"Irregular (I'll log it)"};
function clampDay(y, m, day){ const last = new Date(y, m + 1, 0).getDate(); return ds(new Date(y, m, Math.min(day, last))); }
function shiftWeekend(s){ const d = dd(s).getDay(); return d === 6 ? addD(s, -1) : d === 0 ? addD(s, -2) : s; }
function occ(item, from, to, payday){
  const out = []; const a = item.anchor; if (!a) return out;
  const f = item.freq;
  if (f === "irregular") return out;
  if (f === "once"){ if (a >= from && a <= to) out.push(a); return out; }
  if (f === "weekly" || f === "fortnightly" || f === "fourweekly"){
    const step = f === "weekly" ? 7 : f === "fortnightly" ? 14 : 28;
    let k = Math.floor(diffD(a, from) / step); let d = addD(a, k * step);
    if (d < a) d = a;
    while (d < from) d = addD(d, step);
    while (d <= to){ out.push(d); d = addD(d, step); }
  } else {
    const ad = dd(a); const step = f === "quarterly" ? 3 : f === "yearly" ? 12 : 1;
    let cur = dd(mStart(from)); cur.setMonth(cur.getMonth() - 1);
    const end = dd(to);
    while (cur <= end){
      const y = cur.getFullYear(), m = cur.getMonth();
      const months = (y - ad.getFullYear()) * 12 + (m - ad.getMonth());
      if (months >= 0 && months % step === 0){
        const days = [ad.getDate()]; if (f === "twicemonthly") days.push(item.day2 || 15);
        for (const day of days){ const s = clampDay(y, m, day); if (s >= a && s >= from && s <= to) out.push(s); }
      }
      cur.setMonth(cur.getMonth() + 1);
    }
  }
  if (item.end) return out.filter(s => s <= item.end).map(s => payday ? shiftWeekend(s) : s);
  return out.map(s => payday ? shiftWeekend(s) : s).sort();
}

/* ================================================================ calculations */
function balance(accId, upto){
  const a = acc(accId); let b = a ? num(a.start) : 0;
  for (const t of S.tx){
    if (upto && t.date > upto) continue;
    if (t.type === "in" && t.acc === accId) b += t.amt;
    if (t.type === "out" && t.acc === accId) b -= t.amt;
    if (t.type === "move"){ if (t.acc === accId) b -= t.amt; if (t.to === accId) b += t.amt; }
  }
  return Math.round(b * 100) / 100;
}
function spendingBal(){ return S.accounts.filter(a => a.type === "spending").reduce((s, a) => s + balance(a.id), 0); }
function nextPayday(from){
  let best = null;
  for (const p of S.pays){ const o = occ(p, from, addD(from, 400), true); if (o.length && (!best || o[0] < best)) best = o[0]; }
  return best;
}
function billDue(from, to){
  const out = [];
  for (const b of S.bills){ for (const d of occ(b, from, to)) out.push({b, d, paid: !!(b.paid && b.paid[d])}); }
  return out.sort((x, y) => x.d < y.d ? -1 : 1);
}
function paysIn(from, to){
  const out = [];
  for (const p of S.pays){ for (const d of occ(p, from, to, true)) out.push({p, d, got: !!(p.got && p.got[d])}); }
  return out.sort((x, y) => x.d < y.d ? -1 : 1);
}
function safe(){
  const t = today(); const np = nextPayday(addD(t, 1));
  const until = np ? addD(np, -1) : mEnd(t);
  const daysLeft = diffD(t, until) + 1;
  const bal = spendingBal();
  const overdue = billDue(addD(t, -45), addD(t, -1)).filter(x => !x.paid);
  const upcoming = billDue(t, until).filter(x => !x.paid);
  const billsSum = [...overdue, ...upcoming].reduce((s, x) => s + num(x.b.amt), 0);
  const spentToday = S.tx.filter(x => x.date === t && x.type === "out" && !x.bill && x.cat !== "Savings" && x.cat !== "Debt").reduce((s, x) => s + x.amt, 0);
  const pot = bal - billsSum;
  const perDay = (pot + spentToday) / daysLeft;
  return {bal, billsSum, pot, daysLeft, np, until, perDay, leftToday: perDay - spentToday, spentToday, overdue, upcoming};
}
function monthTotals(from, to){
  let inn = 0, out = 0; const byCat = {};
  for (const t of S.tx){
    if (t.date < from || t.date > to) continue;
    if (t.type === "in") inn += t.amt;
    if (t.type === "out"){ out += t.amt; byCat[t.cat] = (byCat[t.cat] || 0) + t.amt; }
  }
  return {inn, out, kept: inn - out, byCat};
}

/* ================================================================ milestones */
const MS = [
  ["first", "🌱", "First step", "Logged your first spend", () => S.tx.some(t => t.type === "out")],
  ["ten", "🔟", "Getting the hang of it", "Logged 10 entries", () => S.tx.length >= 10],
  ["hundred", "💯", "Habit hero", "Logged 100 entries", () => S.tx.length >= 100],
  ["streak3", "🔥", "Three in a row", "Logged something 3 days running", () => streak() >= 3],
  ["streak7", "🚀", "A whole week", "Logged something 7 days running", () => streak() >= 7],
  ["bill", "🧾", "Bill boss", "Marked a bill as paid", () => S.bills.some(b => b.paid && Object.keys(b.paid).length)],
  ["goal", "🎯", "Dream it", "Set your first goal", () => S.goals.length > 0],
  ["goaldone", "🏆", "Goal reached", "Filled a goal all the way", () => S.goals.some(g => num(g.saved) >= num(g.target) && num(g.target) > 0)],
  ["nospend", "🌿", "No-spend day", "A full day with no everyday spending", () => noSpendDay()],
  ["debtpay", "💪", "Debt chipper", "Logged a debt payment", () => S.tx.some(t => t.cat === "Debt")],
  ["debtfree", "🎉", "Debt-free!", "Paid a debt down to zero", () => S.debts.some(d => num(d.start) > 0 && debtLeft(d) <= 0)],
  ["backup", "💾", "Safe and sound", "Downloaded a backup", () => !!S.lastBackup],
  ["envelope", "✉️", "Boundaries", "Set a spending cap", () => Object.values(S.envelopes).some(v => num(v) > 0)],
  ["kept", "🐷", "In the green", "Kept money at the end of a month", () => { const p = addM(today(), -1); return S.tx.some(t => t.date <= mEnd(p)) && monthTotals(mStart(p), mEnd(p)).kept > 0; }],
];
function streak(){ const days = new Set(S.tx.map(t => t.date)); let n = 0, d = today(); if (!days.has(d)) d = addD(d, -1); while (days.has(d)){ n++; d = addD(d, -1); } return n; }
function noSpendDay(){ const days = new Set(S.tx.map(t => t.date)); for (let i = 1; i < 60; i++){ const d = addD(today(), -i); if (d < S.created) break;
  if (!S.tx.some(t => t.date === d && t.type === "out" && !t.bill && t.cat !== "Savings" && t.cat !== "Debt") && (days.has(addD(d, -1)) || days.has(addD(d, 1)))) return true; } return false; }

    return `<div class="card"><div class="row"><div class="dot" style="background:var(--goal-l);font-size:22px">${esc(g.e || "🎯")}</div><div class="sp"><div class="t" style="font-weight:900;font-size:17px">${esc(g.name)}</div>
      <div class="sub">${g.date ? "by " + nice(g.date) + " " + dd(g.date).getFullYear() : "no date"}</div></div><button class="btn sm ghost" data-act="editgoal" data-id="${g.id}">Edit</button></div>
      <div class="big" style="font-size:32px;color:var(--goal);margin-top:12px">${money(num(g.saved))}</div><div class="sub">of ${money(num(g.target))} · ${pct.toFixed(0)}%</div>
      <div class="bar" style="margin:10px 0"><i style="width:${pct}%;background:var(--goal)"></i></div>
      <div class="sub">${left <= 0 ? "🏆 Done! You did it." : `Still to find ${money(left)}${wk ? ` · about ${money(left / wk)} a week` : ""}`}</div>
      <div class="row" style="margin-top:12px"><button class="btn sm" style="background:var(--goal)" data-act="putaway" data-id="${g.id}">+ Put money away</button></div></div>`; }).join("") || `<div class="card empty">No goals yet. Holiday? Emergency fund? New laptop? Add one. 🌈</div>`}</div>`;
}

function scrDebt(){
  const total = S.debts.reduce((s, d) => s + debtLeft(d), 0);
  const order = S.debts.filter(d => debtLeft(d) > 0).slice().sort((a, b) => debtLeft(a) - debtLeft(b));
  return `${header("Debt", "Still owed — going down", `<button class="btn" data-act="adddebt">+ Add debt</button>`)}
  <div class="grid two">
   <div class="grid">${S.debts.map(d => { const left = debtLeft(d); const pct = num(d.start) ? (1 - left / num(d.start)) * 100 : 0; const m = payoffMonths(left, num(d.rate), num(d.min));
     return `<div class="card"><div class="row"><div class="dot" style="background:var(--debt-l)">💳</div><div class="sp"><div class="t" style="font-weight:900;font-size:17px">${esc(d.name)}</div>
       <div class="sub">${num(d.rate)}% a year · minimum ${money(num(d.min))}</div></div><button class="btn sm ghost" data-act="editdebt" data-id="${d.id}">Edit</button></div>
       <div class="big" style="font-size:32px;color:var(--debt);margin-top:10px">${money(left)}</div><div class="sub">still owed · ${pct.toFixed(0)}% paid off</div>
       <div class="bar" style="margin:10px 0"><i style="width:${pct}%;background:var(--debt)"></i></div>
       <div class="sub">${left <= 0 ? "🎉 Paid off!" : m === Infinity ? "The minimum doesn't cover the interest — try paying a bit more." : `At the minimum: debt-free in about ${m} month${m === 1 ? "" : "s"} (${nice(addM(today(), m))} ${dd(addM(today(), m)).getFullYear()})`}</div>
       <div class="row" style="margin-top:12px"><button class="btn sm" style="background:var(--debt)" data-act="paydebt" data-id="${d.id}">+ Log a payment</button></div></div>`; }).join("") || `<div class="card empty">No debts added. If you have any, adding them here helps you see them shrink.</div>`}</div>
   <div class="grid"><div class="card"><div class="tile"><div class="k">Total still owed</div><div class="v" style="color:var(--debt);font-size:28px">${money(total)}</div></div>
     ${order.length > 1 ? `<h2 style="margin-top:14px"><span class="l">❄️ Snowball order</span></h2><div class="sub" style="margin-bottom:6px">Pay minimums on all, put anything extra on the smallest first:</div>
     <div class="list">${order.map((d, i) => `<div class="item"><div class="dot" style="background:var(--soft)">${i + 1}</div><div class="sp t">${esc(d.name)}</div><div class="amt">${money(debtLeft(d))}</div></div>`).join("")}</div>` : ""}</div></div>
  </div>`;
}
function payoffMonths(bal, rate, pay){ if (bal <= 0) return 0; const r = rate / 1200; if (pay <= bal * r || pay <= 0) return Infinity; let m = 0; while (bal > 0.005 && m < 600){ bal = bal * (1 + r) - pay; m++; } return m; }

function scrEnvelopes(){
  const t = today(); const mt = monthTotals(mStart(t), mEnd(t));
  const caps = S.cats.map(c => ({c, cap: num(S.envelopes[c.n]), spent: mt.byCat[c.n] || 0}));
  const set = caps.filter(x => x.cap > 0); const tc = set.reduce((s, x) => s + x.cap, 0), ts = set.reduce((s, x) => s + x.spent, 0);
  return `${header("Envelopes", "Spending caps for each kind of spend — this month")}
  <div class="grid two">
   <div class="card"><h2><span class="l">✉️ Your caps</span><span class="sub">tap a number to change it</span></h2>
    <div class="list">${caps.map(x => { const pct = x.cap ? Math.min(100, x.spent / x.cap * 100) : 0; const over = x.cap && x.spent > x.cap;
      return `<div class="item" style="flex-wrap:wrap"><div class="dot" style="background:var(--env-l)">${x.c.e}</div><div class="sp"><div class="t">${esc(x.c.n)}</div>
        <div class="s">${x.cap ? `${money(x.spent)} of ${money(x.cap)} · ${over ? `<b style="color:var(--bill)">${money(x.spent - x.cap)} over</b>` : money(x.cap - x.spent) + " left"}` : `spent ${money(x.spent)} · no cap`}</div>
        ${x.cap ? `<div class="bar" style="margin-top:6px;height:8px"><i style="width:${pct}%;background:var(--${over ? "bill" : "env"})"></i></div>` : ""}</div>
        <input style="width:100px;padding:8px 10px" inputmode="decimal" placeholder="Cap" value="${x.cap || ""}" data-act="cap" data-v="${esc(x.c.n)}"></div>`; }).join("")}</div></div>
   <div class="grid"><div class="card"><div class="tiles" style="grid-template-columns:1fr 1fr"><div class="tile"><div class="k">Spent</div><div class="v" style="color:var(--bill)">${money(ts)}</div></div>
     <div class="tile"><div class="k">Left in envelopes</div><div class="v" style="color:var(--env)">${money(tc - ts)}</div></div></div>
     <div class="sub" style="margin-top:12px">Caps are friendly notices, not money set aside. Your safe-to-spend number is still worked out from your real balance and bills.</div></div></div>
  </div>`;
}

function scrReports(){
  const t = today(); const r = sel.range || "month";
  const ranges = {month:["This month", mStart(t), mEnd(t)], m3:["Last 3 months", addM(t, -2), mEnd(t)], m6:["Last 6 months", addM(t, -5), mEnd(t)], year:["This year", t.slice(0, 4) + "-01-01", t.slice(0, 4) + "-12-31"]};
  const [lab, from, to] = ranges[r]; const mt = monthTotals(from, to);
  const cats = Object.entries(mt.byCat).sort((a, b) => b[1] - a[1]); const max = cats.length ? cats[0][1] : 1;
  const months = []; for (let i = 5; i >= 0; i--){ const m = addM(t, -i); months.push([MON[dd(m).getMonth()], monthTotals(m, mEnd(m))]); }
  const mx = Math.max(1, ...months.map(([, x]) => Math.max(x.inn, x.out)));
  const W = 520, H = 200, bw = 26;
  const svg = `<svg viewBox="0 0 ${W} ${H + 26}" width="100%" role="img" aria-label="Money in and out by month">${months.map(([n, x], i) => { const cx = 30 + i * 82;
      const hi = x.inn / mx * H, ho = x.out / mx * H;
      return `<rect x="${cx}" y="${H - hi}" width="${bw}" height="${hi}" rx="6" fill="var(--in)"></rect><rect x="${cx + bw + 4}" y="${H - ho}" width="${bw}" height="${ho}" rx="6" fill="var(--bill)"></rect>
        <text x="${cx + bw + 2}" y="${H + 18}" text-anchor="middle" font-size="13" font-weight="700">${n}</text>`; }).join("")}</svg>`;
  return `${header("At a glance", lab, `<div class="seg">${Object.entries(ranges).map(([k, v]) => `<button class="${r === k ? "on" : ""}" data-act="range" data-v="${k}">${v[0]}</button>`).join("")}</div>`)}
  <div class="grid two">
   <div class="grid">
    <div class="card"><div class="tiles"><div class="tile"><div class="k">Money in</div><div class="v" style="color:var(--in)">${money(mt.inn)}</div></div>
      <div class="tile"><div class="k">Money out</div><div class="v" style="color:var(--bill)">${money(mt.out)}</div></div>
      <div class="tile"><div class="k">Kept</div><div class="v" style="color:var(--${mt.kept >= 0 ? "safe" : "bill"})">${money(mt.kept)}</div></div></div>
      <div class="tile" style="margin-top:10px"><div class="k">Still yours (all accounts now)</div><div class="v">${money(S.accounts.reduce((s, a) => s + balance(a.id), 0))}</div></div></div>
    <div class="card"><h2><span class="l">Last 6 months</span><span class="row" style="gap:12px"><span class="pill" style="background:var(--in-l);color:var(--in)">In</span><span class="pill" style="background:var(--bill-l);color:var(--bill)">Out</span></span></h2>${svg}</div>
   </div>
   <div class="card"><h2><span class="l">Where it went</span></h2><div class="list">${cats.map(([c, v]) => `<div class="item" style="display:block"><div class="row"><span>${catE(c)}</span><b class="sp">${esc(c)}</b><span class="amt">${money(v)}</span><span class="sub" style="width:44px;text-align:right">${(v / mt.out * 100).toFixed(0)}%</span></div>
     <div class="bar" style="margin-top:6px;height:9px"><i style="width:${v / max * 100}%;background:var(--brand)"></i></div></div>`).join("") || `<div class="empty">Nothing logged in this period.</div>`}</div></div>
  </div>`;
}

/* ================================================================ actions */
function addTx(t){ t.id = uid(); t.amt = num(t.amt); if (!t.acc) t.acc = S.accounts[0].id; S.tx.push(t); return t.id; }
function quickLog(){
  const raw = val("qamt"); let amt = num(raw); let cat = sel.cat; const m = raw.match(/^\s*([\d.,]+)\s+(.+)$/);
  if (m){ amt = num(m[1]); const word = m[2].toLowerCase(); const c = S.cats.find(c => c.n.toLowerCase().startsWith(word) || word.startsWith(c.n.toLowerCase())); if (c) cat = c.n; else sel.note = sel.note || m[2]; }
  if (!amt){ toast("Type an amount first"); return; }
  const type = sel.type === "in" ? "in" : "out";
  addTx({date: today(), type, amt, cat: type === "in" ? "Income" : (cat || "Other"), note: val("qnote") || sel.note || "", acc: val("qacc") || S.accounts[0].id});
  sel = {}; save(); render(); toast(type === "in" ? "Added 💰" : `Logged ${money(amt)} ✓`);
}
const ACT = {
  focus(){ focusMode = !focusMode; document.body.classList.toggle("focus", focusMode); render(); },
  why(){ sel.why = !sel.why; render(); },
  ltype(e){ keepQuick(); sel.type = e.dataset.v; render(); },
  plus(e){ keepQuick(); const v = Number(e.dataset.v); sel.amt = v ? String(Math.round((num(sel.amt) + v) * 100) / 100) : ""; render(); },
  qcat(e){ keepQuick(); sel.cat = sel.cat === e.dataset.v ? "" : e.dataset.v; render(); },
  qlog: quickLog,
  deltx(e){ const t = S.tx.find(x => x.id === e.dataset.id); if (!t || !confirm("Delete this entry?")) return;
    S.tx = S.tx.filter(x => x.id !== t.id);
    if (t.bill){ const b = S.bills.find(b => b.id === t.bill); if (b && b.paid) for (const k in b.paid) if (b.paid[k] === t.id) delete b.paid[k]; }
    if (t.pay){ const p = S.pays.find(p => p.id === t.pay); if (p && p.got) for (const k in p.got) if (p.got[k] === t.id) delete p.got[k]; }
    if (t.goal){ const g = S.goals.find(g => g.id === t.goal); if (g) g.saved = Math.max(0, num(g.saved) - t.amt); }
    save(); render(); },
  todo(e){ const t = today(); S.todos[t + "_d"] = S.todos[t + "_d"] || [false, false, false]; S.todos[t + "_d"][e.dataset.i] = e.checked; save(); render(); if (e.checked) toast("Nice one ✨"); },
  mprev(){ sel.m = addM(sel.m || today(), -1); sel.day = null; render(); }, mnext(){ sel.m = addM(sel.m || today(), 1); sel.day = null; render(); },
  day(e){ sel.day = e.dataset.v; render(); },
  logday(e){ forms.log(e.dataset.v); },
  flt(e){ document.querySelectorAll(".sheet .seg button").forEach(b => b.classList.toggle("on", b === e)); document.getElementById("f_type").value = e.dataset.v; },
  savelog(){ const amt = num(val("f_amt")); if (!amt) return toast("Type an amount"); const type = val("f_type");
    addTx({date: val("f_date"), type, amt, cat: type === "in" ? "Income" : val("f_cat"), note: val("f_note"), acc: val("f_acc")}); save(); closeSheet(); render(); },
  addbill(){ forms.bill(); }, editbill(e){ forms.bill(S.bills.find(b => b.id === e.dataset.id)); },
  savebill(e){ const name = val("f_name"), amt = num(val("f_amt")); if (!name || !amt) return toast("Add a name and amount");
    let b = S.bills.find(b => b.id === e.dataset.id); if (!b){ b = {id: uid(), paid: {}}; S.bills.push(b); }
    Object.assign(b, {name, amt, freq: val("f_freq"), anchor: val("f_date") || today(), acc: val("f_acc"), cat: val("f_cat")}); save(); closeSheet(); render(); },
  delbill(e){ if (!confirm("Delete this bill? Past payments stay in your history.")) return; S.bills = S.bills.filter(b => b.id !== e.dataset.id); save(); closeSheet(); render(); },
  paybill(e){ const b = S.bills.find(b => b.id === e.dataset.id), d = e.dataset.d; b.paid = b.paid || {};
    if (b.paid[d]){ S.tx = S.tx.filter(x => x.id !== b.paid[d]); delete b.paid[d]; }
    else { b.paid[d] = addTx({date: d > today() ? today() : d, type: "out", amt: b.amt, cat: b.cat || "Bills", note: b.name, acc: b.acc, bill: b.id}); toast("Paid ✓  " + b.name); }
    save(); render(); },
  addpay(){ forms.pay(); }, editpay(e){ forms.pay(S.pays.find(p => p.id === e.dataset.id)); },
  savepay(e){ const name = val("f_name") || "Pay", amt = num(val("f_amt"));
    let p = S.pays.find(p => p.id === e.dataset.id); if (!p){ p = {id: uid(), got: {}}; S.pays.push(p); }
    Object.assign(p, {name, amt, freq: val("f_freq"), anchor: val("f_date") || today(), day2: Number(val("f_day2")) || 15, acc: val("f_acc")}); save(); closeSheet(); render(); },
  delpay(e){ if (!confirm("Delete this pay schedule?")) return; S.pays = S.pays.filter(p => p.id !== e.dataset.id); save(); closeSheet(); render(); },
  gotpay(e){ const p = S.pays.find(p => p.id === e.dataset.id), d = e.dataset.d; p.got = p.got || {};
    if (p.got[d]){ S.tx = S.tx.filter(x => x.id !== p.got[d]); delete p.got[d]; save(); render(); }
    else forms.amount("Pay arrived 💰", "savegot", p.id + "|" + d, `How much landed? Usual amount ${money(num(p.amt))}.`); setTimeout(() => { const i = document.getElementById("f_amt"); if (i) i.value = p.amt; }, 0); },
  savegot(e){ const [id, d] = e.dataset.id.split("|"); const p = S.pays.find(p => p.id === id); const amt = num(val("f_amt")) || num(p.amt);
    p.got[d] = addTx({date: d > today() ? today() : d, type: "in", amt, cat: "Income", note: p.name, acc: p.acc, pay: p.id}); save(); closeSheet(); render(); toast("Money in ✓"); },
  addin(){ forms.log(today()); setTimeout(() => ACT.flt(document.querySelectorAll(".sheet .seg button")[1]), 0); },
  addgoal(){ forms.goal(); }, editgoal(e){ forms.goal(S.goals.find(g => g.id === e.dataset.id)); },
  savegoal(e){ const name = val("f_name"), target = num(val("f_amt")); if (!name || !target) return toast("Add a name and target");
    let g = S.goals.find(g => g.id === e.dataset.id); if (!g){ g = {id: uid()}; S.goals.push(g); }
    Object.assign(g, {name, target, saved: num(val("f_saved")), date: val("f_date"), e: val("f_e") || "🎯"}); save(); closeSheet(); render(); },
  delgoal(e){ if (!confirm("Delete this goal?")) return; S.goals = S.goals.filter(g => g.id !== e.dataset.id); save(); closeSheet(); render(); },
  putaway(e){ const g = S.goals.find(g => g.id === e.dataset.id); forms.amount("Put money away for " + esc(g.name), "saveput", g.id, "This comes out of your spending money (from the account below).",
    S.accounts.length > 1 ? `<label class="f">From</label>${accSel("f_acc")}` : ""); },
  saveput(e){ const g = S.goals.find(g => g.id === e.dataset.id); const amt = num(val("f_amt")); if (!amt) return;
    const savAcc = S.accounts.find(a => a.type === "savings"); const from = val("f_acc") || S.accounts[0].id;
    if (savAcc && savAcc.id !== from) addTx({date: today(), type: "move", amt, acc: from, to: savAcc.id, goal: g.id, cat: "Savings", note: g.name});
    else addTx({date: today(), type: "out", amt, cat: "Savings", note: g.name, acc: from, goal: g.id});
    g.saved = num(g.saved) + amt; save(); closeSheet(); render(); toast("Put away " + money(amt) + " 🐷"); },
  adddebt(){ forms.debt(); }, editdebt(e){ forms.debt(S.debts.find(d => d.id === e.dataset.id)); },
  savedebt(e){ const name = val("f_name"), start = num(val("f_amt")); if (!name || !start) return toast("Add a name and amount");
    let d = S.debts.find(d => d.id === e.dataset.id); if (!d){ d = {id: uid()}; S.debts.push(d); }
    Object.assign(d, {name, start, rate: num(val("f_rate")), min: num(val("f_min"))}); save(); closeSheet(); render(); },
  deldebt(e){ if (!confirm("Delete this debt?")) return; S.debts = S.debts.filter(d => d.id !== e.dataset.id); save(); closeSheet(); render(); },
  paydebt(e){ const d = S.debts.find(d => d.id === e.dataset.id); forms.amount("Payment on " + esc(d.name), "savedebtpay", d.id, `Minimum is ${money(num(d.min))}.`, S.accounts.length > 1 ? `<label class="f">From</label>${accSel("f_acc")}` : ""); },
  savedebtpay(e){ const amt = num(val("f_amt")); if (!amt) return; const d = S.debts.find(d => d.id === e.dataset.id);
    addTx({date: today(), type: "out", amt, cat: "Debt", note: d.name, acc: val("f_acc") || S.accounts[0].id, debt: d.id}); save(); closeSheet(); render(); toast("Payment logged 💪"); },
  range(e){ sel.range = e.dataset.v; render(); }, msf(e){ sel.f = e.dataset.v; render(); },
  theme(e){ S.look.theme = e.dataset.v; applyTheme(); save(); render(); }, mode(e){ S.look.mode = e.dataset.v; save(); render(); },
  addacc(){ forms.acc(); }, editacc(e){ forms.acc(S.accounts.find(a => a.id === e.dataset.id)); },
  saveacc(e){ const name = val("f_name"); if (!name) return toast("Add a name"); let a = S.accounts.find(a => a.id === e.dataset.id); if (!a){ a = {id: uid()}; S.accounts.push(a); }
    Object.assign(a, {name, type: val("f_type"), start: num(val("f_amt"))}); save(); closeSheet(); render(); },
  delacc(e){ if (S.tx.some(t => t.acc === e.dataset.id || t.to === e.dataset.id)){ toast("This account has entries — it can't be deleted."); return; }
    S.accounts = S.accounts.filter(a => a.id !== e.dataset.id); save(); closeSheet(); render(); },
  move(){ sheet(`<h3>Move money</h3><div class="row"><div class="sp"><label class="f">From</label>${accSel("f_acc")}</div><div class="sp"><label class="f">To</label>${accSel("f_to", (S.accounts[1] || {}).id)}</div></div>
    <label class="f">Amount</label><input id="f_amt" class="amount" inputmode="decimal"><div class="row" style="margin-top:16px"><span class="sp"></span><button class="btn ghost" data-act="close">Cancel</button><button class="btn" data-act="savemove">Move</button></div>`); },
  savemove(){ const amt = num(val("f_amt")), a = val("f_acc"), b = val("f_to"); if (!amt || a === b) return toast("Pick two different accounts and an amount");
    addTx({date: today(), type: "move", amt, acc: a, to: b, cat: "Move"}); save(); closeSheet(); render(); },
  addcat(){ const n = prompt("Name of the new kind of spending:"); if (!n) return; const e = prompt("An emoji for it (optional):", "✨") || "✨"; if (S.cats.some(c => c.n === n)) return; S.cats.push({n, e}); save(); render(); },
  editcat(e){ const c = S.cats.find(c => c.n === e.dataset.v); const n = prompt(`Rename “${c.n}” (leave empty to remove it):`, c.n); if (n === null) return;
    if (!n){ if (confirm("Remove “" + c.n + "”? Past entries keep their label.")) S.cats = S.cats.filter(x => x !== c); }
    else { const old = c.n; c.n = n; const em = prompt("Emoji:", c.e); if (em) c.e = em; S.tx.forEach(t => { if (t.cat === old) t.cat = n; }); if (S.envelopes[old] != null){ S.envelopes[n] = S.envelopes[old]; delete S.envelopes[old]; } }
    save(); render(); },
  backup(){ S.lastBackup = today(); save(); download(`calm-money-backup-${today()}.json`, JSON.stringify(S, null, 1), "application/json"); toast("Backup downloaded 💾"); render(); },
  csv(){ const rows = [["Date","Type","Amount","Kind","Account","Note"]].concat(S.tx.slice().sort((a, b) => a.date < b.date ? -1 : 1).map(t => [t.date, t.type, t.amt, t.cat || "", acc(t.acc).name, t.note || ""]));
    download(`calm-money-${today()}.csv`, rows.map(r => r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n"), "text/csv"); },
  demo(){ if (S.onboarded && S.tx.length && !confirm("Replace everything with example data?")) return; S = demoData(); save(); sel = {}; view = "today"; applyTheme(); render(); toast("Example data loaded — explore away!"); },
  erase(){ if (!confirm("Erase everything on this device? There's no undo.")) return; if (!confirm("Really erase? Download a backup first if you might need it.")) return; localStorage.removeItem(KEY); S = blank(); sel = {}; view = "today"; render(); },
  print(){ window.print(); },
  close: closeSheet, closebg(e, ev){ if (ev.target === e) closeSheet(); },
  obnext(){ const st = sel.ob || 0;
    if (st === 0){ S.profile.name = val("ob_name"); S.profile.cur = val("ob_cur") || "$"; }

    sel.ob = st + 1; render(); },
  obback(){ sel.ob = Math.max(0, (sel.ob || 0) - 1); render(); },

};
function finishOnboard(){ S.onboarded = true; S.created = today(); sel = {}; save(); render(); toast("You're all set 🌙"); try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){} }
function keepQuick(){ const a = document.getElementById("qamt"), n = document.getElementById("qnote"); if (a) sel.amt = a.value; if (n) sel.note = n.value; }
function download(name, text, type){ const b = new Blob([text], {type}); const a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500); }

/* ================================================================ events */
document.addEventListener("click", ev => {
  const g = ev.target.closest("[data-go]"); if (g){ go(g.dataset.go); return; }
  const a = ev.target.closest("[data-act]"); if (!a) return;
  const k = a.dataset.act; if (["todo", "todotext", "brain", "mnote", "cap", "hq", "restore", "qcatsel"].includes(k)) return;
  if (ACT[k]){ ev.preventDefault(); ACT[k](a, ev); }
});
document.addEventListener("change", ev => {
  const a = ev.target.closest("[data-act]"), s = ev.target.closest("[data-set]");
  if (s){ const [o, k] = s.dataset.set.split("."); S[o][k] = s.tagName === "SELECT" && k === "dec" ? Number(s.value) : s.value; save(); if (k !== "name") render(); return; }
  if (!a) return; const k = a.dataset.act;
  if (k === "todo") ACT.todo(a);
  if (k === "qcatsel"){ keepQuick(); sel.cat = a.value; render(); }
  if (k === "cap"){ S.envelopes[a.dataset.v] = num(a.value); save(); render(); }
  if (k === "restore"){ const f = a.files[0]; if (!f) return; const r = new FileReader();
    r.onload = () => { try{ const d = JSON.parse(r.result); if (!d || !d.accounts || !d.tx) throw 0; if (!confirm("Replace the data on this device with this backup?")) return; S = Object.assign(blank(), d); save(); applyTheme(); render(); toast("Backup restored ✓"); }
      catch(e){ toast("That file isn't a Calm Money backup."); } }; r.readAsText(f); }
});
let tmr;
document.addEventListener("input", ev => {
  const a = ev.target.closest("[data-act]"); if (!a) return; const k = a.dataset.act;
  if (k === "todotext"){ const t = today(); S.todos[t] = S.todos[t] || ["", "", ""]; S.todos[t][a.dataset.i] = a.value; clearTimeout(tmr); tmr = setTimeout(save, 400); }
  if (k === "brain"){ S.brain = a.value; clearTimeout(tmr); tmr = setTimeout(save, 400); }
  if (k === "mnote"){ S.notes[a.dataset.v] = a.value; clearTimeout(tmr); tmr = setTimeout(save, 400); }
  if (k === "hq"){ sel.q = a.value; render(); const i = document.querySelector('[data-act="hq"]'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Enter" && ev.target.id === "qamt"){ ev.preventDefault(); keepQuick(); quickLog(); return; }
  if (ev.key === "Escape") closeSheet();
  if (/INPUT|TEXTAREA|SELECT/.test(ev.target.tagName) || ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const m = {t: "today", p: "planner", b: "bills", m: "income"};
  if (ev.key === "/"){ ev.preventDefault(); if (view !== "today") go("today"); setTimeout(() => { const q = document.getElementById("qamt"); if (q) q.focus(); }, 0); }
  else if (ev.key === "f" || ev.key === "F"){ if (view === "today") ACT.focus(); }
  else if (m[ev.key]) go(m[ev.key]);
});

/* ================================================================ render */
function applyTheme(){ const t = S.look.theme === "auto" ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light") : S.look.theme;
  document.documentElement.dataset.theme = t; document.querySelector('meta[name="theme-color"]').content = t === "dark" ? "#13132A" : "#F4F1FA"; }
function render(){
  const app = document.getElementById("app");
  if (!S.onboarded){ app.innerHTML = scrOnboard(); document.getElementById("bottomnav").innerHTML = ""; document.getElementById("sidenav").innerHTML = ""; return; }
  const scr = {today: scrToday, planner: scrPlanner, bills: scrBills, income: scrIncome, goals: scrGoals, debt: scrDebt, envelopes: scrEnvelopes, reports: scrReports,
               milestones: scrMilestones, settings: scrSettings, help: scrHelp, more: scrMore}[view] || scrToday;
  app.innerHTML = scr(); renderNav();
}

/* ================================================================ example data */
function demoData(){
  const d = blank(); const t = today(); d.onboarded = true; d.profile.name = "Sam"; d.created = addD(t, -75); d.look.mode = "full";
